[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra summary for failures and warnings; no stdout capture by default
addopts = -p no:cacheprovider

# Register custom markers (none yet; kept for future use)
markers =
    slow: marks tests as slow-running
    smoke: marks tests as smoke/sanity checks
